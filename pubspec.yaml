name: demo_monorepo
publish_to: 'none'

environment:
  sdk: ^3.13.3

workspace:
  - apps/banking_app
  - packages/design_system
  - packages/send_money_experience
  - tools/ds_lint_migrator

dev_dependencies:
  melos: ^8.8.0
  custom_lint: ^0.8.1
  ds_lint_migrator:
    path: tools/ds_lint_migrator

dependency_overrides:
  cli_util: ^0.4.2

melos:
  command:
    version:
      branch: main
      message: |
        chore(release): version packages

        {new_package_versions}

  scripts:
    analyze:
      run: melos exec -- "dart analyze ."
      description: Corre dart analyze en cada paquete/app del monorepo.

    test:
      run: melos exec --dir-exists="test" -- "flutter test"
      description: Corre tests donde exista carpeta test/.

    lint:custom:
      run: dart run custom_lint
      description: >-
        Corre el plugin custom_lint sobre todo el workspace. Se ejecuta desde
        la raíz (no por paquete) porque custom_lint todavía no descubre
        `.dart_tool/package_config.json` por paquete en un Dart workspace,
        solo el de la raíz.

    fix:ds-migration:
      run: dart fix --apply
      description: Aplica automáticamente los quick fixes detectados por custom_lint.
